# ============================================================================
# Model-agnostic provider inventory.
#
# The gateway's edge is always OpenAI-Chat-Completions-compatible. The provider
# `type` selects the wire adapter:
#   type: anthropic  -> native Anthropic Messages API (first-class, optimized)
#   anything else    -> OpenAI-compatible (OpenAI, Ollama, vLLM, LM Studio,
#                        llama.cpp, LiteLLM, Together, Groq, ...)
#
# Changing the provider NEVER changes the ZTA/NIST controls — RBAC, capability
# tokens, JSON-Schema validation, the firewall, egress DLP, and audit all run
# downstream on {principal, resource, payload}, independent of the model.
# ============================================================================
providers:

  # ---- Anthropic (recommended / optimized path) --------------------------
  provider_anthropic:
    type: "anthropic"
    endpoint: "https://api.anthropic.com/v1/messages"
    api_key_env: "ANTHROPIC_API_KEY"     # set in the env / K8s Secret
    anthropic_version: "2023-06-01"
    max_tokens: 4096                     # Anthropic Messages API requires this
    # thinking: true                     # opt in to adaptive thinking
    # effort: "high"                     # low|medium|high|xhigh|max

  # ---- OpenAI (and OpenAI-compatible cloud) ------------------------------
  provider_openai:
    type: "openai"
    endpoint: "https://api.openai.com/v1/chat/completions"
    api_key_env: "REMOTE_API_KEY"

  # ---- Local / self-hosted (OpenAI-compatible: Ollama, vLLM, LM Studio) --
  provider_local:
    type: "openai"                        # OpenAI-compatible wire format
    endpoint: "http://host.docker.internal:11434/v1/chat/completions"
    api_key_env: "NULL_KEY"               # NULL_KEY = send no Authorization header

  # ---- Example: one LiteLLM proxy fronting many providers ----------------
  # provider_litellm:
  #   type: "openai"
  #   endpoint: "http://litellm:4000/v1/chat/completions"
  #   api_key_env: "LITELLM_KEY"

  # ---- Native cloud adapters (no proxy needed) ---------------------------
  # Claude on Amazon Bedrock (SigV4 via AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY;
  # model id in the URL, e.g. anthropic.claude-opus-4-8):
  # provider_bedrock:
  #   type: "bedrock"
  #   region: "us-east-1"
  # Claude on Google Vertex AI (bearer via api_key_env or GOOGLE_ACCESS_TOKEN):
  # provider_vertex:
  #   type: "vertex"
  #   region: "us-east5"
  #   project: "my-gcp-project"
  #   api_key_env: "GOOGLE_ACCESS_TOKEN"
  # Google Gemini (native generateContent API):
  # provider_gemini:
  #   type: "gemini"
  #   api_key_env: "GEMINI_API_KEY"

# Every principal that can call the gateway must be provisioned a model here,
# otherwise the gateway returns 403 (no model provisioned). A principal can be
# pointed at ANY provider — mix Anthropic, OpenAI, and local freely.
models:
  principal_analyst:                      # local, zero-config, works offline
    provider: "provider_local"
    upstream_model_id: "mistral:7b-instruct"

  principal_auditor:
    provider: "provider_local"
    upstream_model_id: "mistral:7b-instruct"

  principal_netbot:
    provider: "provider_local"
    upstream_model_id: "mistral:7b-instruct"

  principal_admin:                        # Anthropic — the optimized path
    provider: "provider_anthropic"
    upstream_model_id: "claude-opus-4-8"
