# Public-facing gateway. The only externally-reachable service. Autoscaled.
apiVersion: apps/v1
kind: Deployment
metadata: {name: service-gateway, namespace: mcp-secure}
spec:
  replicas: 3
  selector: {matchLabels: {app: service-gateway}}
  template:
    metadata: {labels: {app: service-gateway, tier: edge}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: mcp-universal:6.0
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "src.service_gateway.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
          ports: [{containerPort: 8000}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          env:
            - {name: CONFIG_PATH, value: /app/config}
            - {name: REDIS_URL, value: "redis://redis-store:6379"}
            - {name: INGRESS_URL, value: "http://service-ingress:8443/process"}
            - {name: AUTH_KEYS_PATH, value: /app/secrets/api_keys.json}
            - {name: RATE_LIMIT_FAIL_CLOSED, value: "true"}
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: mcp-provider, key: ANTHROPIC_API_KEY, optional: true}}
            - name: REMOTE_API_KEY
              valueFrom: {secretKeyRef: {name: mcp-provider, key: REMOTE_API_KEY, optional: true}}
          resources: {requests: {cpu: "100m", memory: "192Mi"}, limits: {cpu: "1", memory: "384Mi"}}
          readinessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 3, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8000}, initialDelaySeconds: 5, periodSeconds: 15}
          volumeMounts:
            - {name: config, mountPath: /app/config, readOnly: true}
            - {name: api-keys, mountPath: /app/secrets, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: mcp-config}}
        - {name: api-keys, secret: {secretName: mcp-api-keys}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: service-gateway, namespace: mcp-secure}
spec:
  selector: {app: service-gateway}
  ports: [{port: 8000, targetPort: 8000}]
  # ClusterIP by default; expose via the Ingress in 60-ingress.yaml (or set type: LoadBalancer).
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: service-gateway, namespace: mcp-secure}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: service-gateway}
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
    - type: Resource
      resource: {name: memory, target: {type: Utilization, averageUtilization: 80}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 120}
    scaleUp: {stabilizationWindowSeconds: 15}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: service-enforcer, namespace: mcp-secure}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: service-enforcer}
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
---
# Keep the gateway available during voluntary disruptions (drains, upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: service-gateway, namespace: mcp-secure}
spec:
  minAvailable: 2
  selector: {matchLabels: {app: service-gateway}}
