x-build: &build
  build: {context: ../.., dockerfile: deploy/docker/Dockerfile}

x-app-env: &app-env
  CONFIG_PATH: /app/config
  REDIS_URL: redis://redis_store:6379
  LOG_LEVEL: INFO

services:
  redis_store:
    image: redis:7-alpine
    read_only: true
    tmpfs: ["/data"]
    restart: always

  service_gateway:
    <<: *build
    command: uvicorn src.service_gateway.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    read_only: true
    volumes:
      - "../../config:/app/config:ro"
      - "../../secrets:/app/secrets:ro"
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      <<: *app-env
      INGRESS_URL: http://service_ingress:8443/process
      AUTH_KEYS_PATH: /app/secrets/api_keys.json
      RATE_LIMIT_FAIL_CLOSED: "true"   # match k8s posture: Redis outage != unthrottled
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REMOTE_API_KEY: ${REMOTE_API_KEY:-}
    depends_on: [redis_store, service_ingress]

  service_ingress:
    <<: *build
    command: uvicorn src.service_ingress.main:app --host 0.0.0.0 --port 8443
    read_only: true
    volumes: ["../../config:/app/config:ro"]
    environment:
      <<: *app-env
      REGISTRY_URL: http://service_registry:8500/authorize
      ENFORCER_URL: http://service_enforcer:8650/execute
      LOG_ENC_KEY_HEX: ${LOG_ENC_KEY_HEX:-}
    depends_on: [service_registry, service_enforcer]

  service_registry:
    <<: *build
    command: uvicorn src.service_registry.main:app --host 0.0.0.0 --port 8500
    read_only: true
    volumes:
      - "../../config:/app/config:ro"
      - "../../keys:/app/keys:ro"
    environment: {<<: *app-env}
    depends_on: [redis_store]

  service_enforcer:
    <<: *build
    command: uvicorn src.service_enforcer.main:app --host 0.0.0.0 --port 8650
    read_only: true
    volumes:
      - "../../config:/app/config:ro"
      - "../../keys:/app/keys:ro"
    environment:
      <<: *app-env
      LOG_ENC_KEY_HEX: ${LOG_ENC_KEY_HEX:-}
    depends_on: [redis_store]

  node-fs:
    <<: *build
    command: uvicorn src.worker_nodes.node_fs:app --host 0.0.0.0 --port 8620
    read_only: true
    volumes: ["../../data/sandbox:/app/data/sandbox"]

  node-db:
    <<: *build
    command: uvicorn src.worker_nodes.node_db:app --host 0.0.0.0 --port 8610
    read_only: true

  node-net:
    <<: *build
    command: uvicorn src.worker_nodes.node_net:app --host 0.0.0.0 --port 8630
    read_only: true
