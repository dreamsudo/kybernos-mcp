<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" viewBox="0 0 940 700" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#495057"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="700" fill="#ffffff"/>
  <text x="470" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#212529">Kybernos — Zero-Trust Architecture · Psypher Labs</text>
  <text x="470" y="56" text-anchor="middle" font-size="13" fill="#868e96">Model-agnostic edge · Anthropic-optimized · security controls are provider-independent</text>

  <!-- Client -->
  <rect x="360" y="74" width="220" height="42" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="470" y="100" text-anchor="middle" font-size="14" font-weight="600" fill="#212529">Client — POST /v1/chat/completions</text>

  <!-- EDGE zone -->
  <rect x="40" y="140" width="560" height="78" rx="12" fill="#e7f5ff" stroke="#1c7ed6"/>
  <text x="52" y="160" font-size="12" font-weight="700" fill="#1971c2">EDGE ZONE · public</text>
  <rect x="60" y="166" width="520" height="42" rx="8" fill="#ffffff" stroke="#1c7ed6"/>
  <text x="320" y="192" text-anchor="middle" font-size="14" font-weight="600" fill="#212529">service-gateway :8000 — authN · rate-limit · provider adapter</text>

  <!-- Upstream LLM providers -->
  <rect x="640" y="140" width="260" height="130" rx="12" fill="#f8f9fa" stroke="#868e96"/>
  <text x="652" y="160" font-size="12" font-weight="700" fill="#495057">UPSTREAM LLM (per principal)</text>
  <rect x="656" y="170" width="228" height="26" rx="6" fill="#fff4e6" stroke="#f08c00"/>
  <text x="770" y="188" text-anchor="middle" font-size="12.5" fill="#212529">Anthropic — native (optimized)</text>
  <rect x="656" y="200" width="228" height="26" rx="6" fill="#ffffff" stroke="#adb5bd"/>
  <text x="770" y="218" text-anchor="middle" font-size="12.5" fill="#212529">OpenAI / Bedrock / Vertex / Gemini</text>
  <rect x="656" y="230" width="228" height="26" rx="6" fill="#ffffff" stroke="#adb5bd"/>
  <text x="770" y="248" text-anchor="middle" font-size="12.5" fill="#212529">Local — Ollama / vLLM / LM Studio</text>

  <!-- CONTROL zone -->
  <rect x="40" y="292" width="860" height="112" rx="12" fill="#ede7f6" stroke="#7048e8"/>
  <text x="52" y="312" font-size="12" font-weight="700" fill="#6741d9">CONTROL ZONE · internal only</text>
  <rect x="60" y="320" width="220" height="70" rx="8" fill="#ffffff" stroke="#7048e8"/>
  <text x="170" y="349" text-anchor="middle" font-size="13.5" font-weight="600" fill="#212529">service-ingress</text>
  <text x="170" y="368" text-anchor="middle" font-size="12" fill="#868e96">:8443 · audit in/out</text>
  <rect x="330" y="320" width="240" height="70" rx="8" fill="#ffffff" stroke="#7048e8"/>
  <text x="450" y="349" text-anchor="middle" font-size="13.5" font-weight="600" fill="#212529">service-registry</text>
  <text x="450" y="368" text-anchor="middle" font-size="12" fill="#868e96">:8500 · RBAC + ES256 token</text>
  <rect x="620" y="320" width="260" height="70" rx="8" fill="#ffffff" stroke="#7048e8"/>
  <text x="750" y="345" text-anchor="middle" font-size="13.5" font-weight="600" fill="#212529">service-enforcer :8650</text>
  <text x="750" y="363" text-anchor="middle" font-size="11.5" fill="#868e96">verify · scope · schema · firewall</text>
  <text x="750" y="379" text-anchor="middle" font-size="11.5" fill="#868e96">execute · egress-DLP</text>

  <!-- WORKER zone -->
  <rect x="40" y="440" width="860" height="86" rx="12" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="52" y="460" font-size="12" font-weight="700" fill="#099268">WORKER ZONE · sandboxed · only the enforcer may call</text>
  <rect x="60" y="468" width="260" height="46" rx="8" fill="#ffffff" stroke="#0ca678"/>
  <text x="190" y="496" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">node-fs :8620</text>
  <rect x="340" y="468" width="260" height="46" rx="8" fill="#ffffff" stroke="#0ca678"/>
  <text x="470" y="496" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">node-db :8610 (mock)</text>
  <rect x="620" y="468" width="260" height="46" rx="8" fill="#ffffff" stroke="#0ca678"/>
  <text x="750" y="496" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">node-net :8630 (mock)</text>

  <!-- STATE zone -->
  <rect x="40" y="548" width="860" height="62" rx="12" fill="#fff0f6" stroke="#e64980"/>
  <text x="52" y="568" font-size="12" font-weight="700" fill="#c2255c">STATE ZONE</text>
  <rect x="360" y="566" width="220" height="34" rx="8" fill="#ffffff" stroke="#e64980"/>
  <text x="470" y="588" text-anchor="middle" font-size="13" font-weight="600" fill="#212529">redis-store :6379 — tokens · rate-limit</text>

  <!-- footer note -->
  <text x="470" y="640" text-anchor="middle" font-size="12.5" fill="#495057">Every tool call → { principal, resource, payload } → RBAC · ES256 capability token · JSON-Schema (authoritative)</text>
  <text x="470" y="660" text-anchor="middle" font-size="12.5" fill="#495057">→ 112-rule firewall (defense-in-depth) → sandboxed execute → egress-DLP → AES-256-GCM audit</text>
  <text x="470" y="684" text-anchor="middle" font-size="12" font-style="italic" fill="#868e96">A zero-trust NetworkPolicy makes each service reachable only by its legitimate caller.</text>

  <!-- arrows -->
  <line x1="470" y1="116" x2="470" y2="140" stroke="#495057" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="600" y1="187" x2="640" y2="200" stroke="#495057" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="640" y1="230" x2="600" y2="200" stroke="#adb5bd" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arw)"/>
  <line x1="320" y1="218" x2="200" y2="320" stroke="#495057" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="280" y1="352" x2="330" y2="352" stroke="#495057" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="280" y1="368" x2="620" y2="368" stroke="#495057" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="750" y1="390" x2="470" y2="468" stroke="#495057" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="450" y1="390" x2="470" y2="566" stroke="#e64980" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arw)"/>
  <line x1="750" y1="390" x2="560" y2="566" stroke="#e64980" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arw)"/>
</svg>
