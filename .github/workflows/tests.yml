name: Kybernos tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Generate local secrets (ES256 keypair, log key, API keys)
        run: bash scripts/gen_keys.sh

      - name: Run full test suite
        run: bash scripts/run_tests.sh --keep-going
